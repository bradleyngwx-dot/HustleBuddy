{% extends 'core/base.html' %}

{% block content %}
<div class="card" style="max-width: 500px; margin: 40px auto; text-align: center;">
    <div style="width: 60px; height: 60px; background: #FEE2E2; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px;">
        <span style="font-size: 24px;">⚠️</span>
    </div>
    
    <h2 style="color: var(--navy-base); margin-bottom: 12px;">Delete {{ client.name }}?</h2>
    <p style="color: var(--text-muted); margin-bottom: 30px;">
        Are you sure you want to delete this client? All associated notes and data will be permanently removed. This action cannot be undone.
    </p>

    <!-- Backend will handle the POST logic later -->
    <form method="post" style="display: flex; gap: 12px; justify-content: center;">
        {% csrf_token %}
        <a href="{% url 'client_detail' client.id %}" class="btn btn-secondary">Cancel</a>
        <button type="submit" class="btn btn-danger">Yes, Delete Client</button>
    </form>
</div>
{% endblock %}
