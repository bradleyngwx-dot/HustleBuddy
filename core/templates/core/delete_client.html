{% extends "core/base.html" %}

{% block title %}Delete client - HustleBuddy{% endblock %}

{% block content %}
    <h1>Delete client</h1>
    <p>Are you sure you want to delete <strong>{{ client.name }}</strong>?</p>
    <p>This action cannot be undone.</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Yes, delete client</button>
    </form>

    <p><a href="{% url 'client_detail' client.id %}">Cancel</a></p>
{% endblock %}
