{% extends 'core/base.html' %}

{% block auth_content %}
<div class="card" style="width: 100%; max-width: 400px; text-align: center;">
    <h2 style="margin-bottom: 8px; color: var(--navy-base);">Join HustleBuddy</h2>
    <p style="color: var(--text-muted); margin-bottom: 24px;">Create your account</p>

    <form method="post" style="text-align: left;">
        {% csrf_token %}
        
        {% if form.errors %}
            <div style="color: var(--red-danger); font-size: 0.9rem; margin-bottom: 16px;">
                Please ensure all fields are correct.
            </div>
        {% endif %}
        
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" name="username" id="username" class="form-control" required>
        </div>

        <div class="form-group">
            <label for="password1">Password</label>
            <input type="password" name="password1" id="password1" class="form-control" required>
        </div>

        <div class="form-group">
            <label for="password2">Confirm Password</label>
            <input type="password" name="password2" id="password2" class="form-control" required>
        </div>

        <button type="submit" class="btn btn-primary btn-block" style="margin-top: 10px;">Sign Up</button>
    </form>

    <div style="margin-top: 24px;">
        <p style="color: var(--text-muted); font-size: 0.9rem;">
            Already have an account? <a href="{% url 'login' %}" style="color: var(--blue-primary); text-decoration: none; font-weight: 500;">Log in here</a>
        </p>
    </div>
</div>
{% endblock %}
