<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Sign up - HustleBuddy</title>
</head>
<body>
    <main>
        <h1>Sign up</h1>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Create account</button>
        </form>

        <p>
            Already have an account?
            <a href="{% url 'login' %}">Log in</a>
        </p>
    </main>
</body>
</html>
