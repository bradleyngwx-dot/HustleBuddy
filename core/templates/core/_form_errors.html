{% if form.non_field_errors %}
    <div style="color: var(--red-danger); background: #FEE2E2; padding: 12px; border-radius: 8px; margin-bottom: 20px;">
        {% for error in form.non_field_errors %}
            <p style="margin: 0; font-weight: 500;">{{ error }}</p>
        {% endfor %}
    </div>
{% endif %}

{% for field in form %}
    {% if field.errors %}
        <div style="color: var(--red-danger); background: #FEE2E2; padding: 12px; border-radius: 8px; margin-bottom: 20px;">
            {% for error in field.errors %}
                <p style="margin: 0; font-size: 0.95rem;"><strong>{{ field.label }}:</strong> {{ error }}</p>
            {% endfor %}
        </div>
    {% endif %}
{% endfor %}
