{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HustleBuddy</title>
    <link rel="stylesheet" href="{% static 'core/css/style.css' %}">
</head>
<body>
    {% if user.is_authenticated %}
        <div class="dashboard-wrapper">
            <!-- Sidebar -->
            <aside class="sidebar">
                <a href="{% url 'client_list' %}" class="sidebar-logo">
                    💼 Hustle<span>Buddy</span>
                </a>
                <ul class="nav-links">
                    <li><a href="{% url 'client_list' %}">Clients</a></li>
                    <li><a href="{% url 'add_client' %}">Add Client</a></li>
                </ul>
                <div style="margin-top: auto;">
                    <form method="post" action="{% url 'account_logout' %}" class="logout-form">
                        {% csrf_token %}
                        <button type="submit">Log out</button>
                    </form>
                </div>
            </aside>
            
            <!-- Main Area -->
            <main class="main-content">
                {% block content %}{% endblock %}
            </main>
        </div>
    {% else %}
        <!-- Auth Layout for Login/Signup -->
        <div class="auth-wrapper">
            {% block auth_content %}{% endblock %}
        </div>
    {% endif %}

    <script src="{% static 'core/js/script.js' %}"></script>
</body>
</html>
