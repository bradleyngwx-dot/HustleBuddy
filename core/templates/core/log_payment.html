{% extends "core/base.html" %}

{% block title %}Log Payment - HustleBuddy{% endblock %}

{% block content %}
<div class="page-header">
    <h1 class="page-title">Log Payment for {{ client.name }}</h1>
    <a href="{% url 'client_detail' client.id %}" class="btn btn-secondary">Cancel</a>
</div>

<div class="card" style="max-width: 600px;">
    <form method="post">
        {% csrf_token %}

        {% include "core/_form_errors.html" %}

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
            <div class="form-group">
                <label for="amount">Amount ($)</label>
                <input type="number" name="amount" id="amount" class="form-control" step="0.01" min="0" placeholder="e.g., 150.00" required>
            </div>

            <div class="form-group">
                <label for="status">Status</label>
                <select name="status" id="status" class="form-control">
                    <option value="pending">Pending</option>
                    <option value="paid">Paid</option>
                    <option value="overdue">Overdue</option>
                </select>
            </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
            <div class="form-group">
                <label for="date_issued">Date Issued</label>
                <input type="date" name="date_issued" id="date_issued" class="form-control" required>
            </div>

            <div class="form-group">
                <label for="date_paid">Date Paid <span style="color: var(--text-muted); font-weight: normal;">(optional)</span></label>
                <input type="date" name="date_paid" id="date_paid" class="form-control">
            </div>
        </div>

        <div class="form-group">
            <label for="description">Description <span style="color: var(--text-muted); font-weight: normal;">(optional)</span></label>
            <input type="text" name="description" id="description" class="form-control" placeholder="e.g., Invoice #001 — Logo design" maxlength="255">
        </div>

        <button type="submit" class="btn btn-primary" style="margin-top: 10px;">Save Payment</button>
    </form>
</div>
{% endblock %}
