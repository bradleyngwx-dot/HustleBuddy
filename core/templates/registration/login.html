<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Log in - HustleBuddy</title>
</head>
<body>
    <main>
        <h1>Log in</h1>

        {% if form.errors %}
            <p>Your username and password did not match. Please try again.</p>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Log in</button>
        </form>

        <p>
            Don't have an account?
            <a href="{% url 'signup' %}">Sign up here</a>
        </p>
    </main>
</body>
</html>
