{% extends 'core/base.html' %}

{% block auth_content %}
<div class="card" style="width: 100%; max-width: 400px; text-align: center;">
    <h2 style="margin-bottom: 8px; color: var(--navy-base);">Welcome back</h2>
    <p style="color: var(--text-muted); margin-bottom: 24px;">Log in to HustleBuddy</p>

    <form method="post" style="text-align: left;">
        {% csrf_token %}
        
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" name="username" id="username" class="form-control" required>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" name="password" id="password" class="form-control" required>
        </div>

        <button type="submit" class="btn btn-primary btn-block" style="margin-top: 10px;">Log In</button>
        <input type="hidden" name="next" value="{{ next }}">
    </form>

    <div style="margin-top: 24px;">
        <p style="color: var(--text-muted); font-size: 0.9rem;">
            Don't have an account? <a href="{% url 'signup' %}" style="color: var(--blue-primary); text-decoration: none; font-weight: 500;">Sign up here</a>
        </p>
    </div>
</div>
{% endblock %}
